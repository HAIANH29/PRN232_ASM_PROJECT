services:
  web:
    build:
      context: .
      dockerfile: src/Web/LongevityDiet.Web/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      api-gateway:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateways/LongevityDiet.ApiGateway/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      identity-service:
        condition: service_started
      diet-knowledge-service:
        condition: service_started
      meal-planning-service:
        condition: service_started
      tracking-service:
        condition: service_started

  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity/LongevityDiet.Identity.Api/Dockerfile
    ports:
      - "5101:8080"
    environment:
      ConnectionStrings__IdentityDb: Host=identity-db;Port=5432;Database=IdentityDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-replace-with-secret}
      IdentitySeed__AdminEmail: ${IDENTITY_ADMIN_EMAIL:-admin@longevity.local}
      IdentitySeed__AdminPassword: ${IDENTITY_ADMIN_PASSWORD:-Admin@123456}
      IdentitySeed__AdminDisplayName: ${IDENTITY_ADMIN_DISPLAY_NAME:-Demo Admin}
      IdentitySeed__UserEmail: ${IDENTITY_USER_EMAIL:-user@longevity.local}
      IdentitySeed__UserPassword: ${IDENTITY_USER_PASSWORD:-User@123456}
      IdentitySeed__UserDisplayName: ${IDENTITY_USER_DISPLAY_NAME:-Demo User}
    depends_on:
      identity-db:
        condition: service_healthy

  diet-knowledge-service:
    build:
      context: .
      dockerfile: src/Services/DietKnowledge/LongevityDiet.DietKnowledge.Api/Dockerfile
    ports:
      - "5102:8080"
    environment:
      ConnectionStrings__DietKnowledgeDb: Host=diet-knowledge-db;Port=5432;Database=DietKnowledgeDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-replace-with-secret}
      DietKnowledgeSeed__IncludeDemoApprovedContent: ${DIET_KNOWLEDGE_SEED_INCLUDE_DEMO_APPROVED_CONTENT:-true}
      BookKnowledgeIngestion__StoragePath: ${BOOK_KNOWLEDGE_STORAGE_PATH:-/app/storage/book-sources}
      Gemini__Enabled: ${GEMINI_ENABLED:-false}
      Gemini__Endpoint: ${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com}
      Gemini__ApiKey: ${GEMINI_API_KEY:-development-only}
      Gemini__Model: ${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - diet-knowledge-book-sources:/app/storage/book-sources
    depends_on:
      diet-knowledge-db:
        condition: service_healthy

  meal-planning-service:
    build:
      context: .
      dockerfile: src/Services/MealPlanning/LongevityDiet.MealPlanning.Api/Dockerfile
    ports:
      - "5103:8080"
    environment:
      ConnectionStrings__MealPlanningDb: Host=meal-planning-db;Port=5432;Database=MealPlanningDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      DietKnowledgeService__BaseUrl: http://diet-knowledge-service:8080
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-replace-with-secret}
      RabbitMq__HostName: rabbitmq
    depends_on:
      meal-planning-db:
        condition: service_healthy
      diet-knowledge-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  tracking-service:
    build:
      context: .
      dockerfile: src/Services/Tracking/LongevityDiet.Tracking.Api/Dockerfile
    ports:
      - "5104:8080"
    environment:
      ConnectionStrings__TrackingDb: Host=tracking-db;Port=5432;Database=TrackingDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-replace-with-secret}
      NotificationService__GrpcAddress: http://notification-service:8080
    depends_on:
      tracking-db:
        condition: service_healthy
      notification-service:
        condition: service_started

  recommendation-service:
    build:
      context: .
      dockerfile: src/Services/Recommendation/LongevityDiet.Recommendation.Service/Dockerfile
    environment:
      RabbitMq__HostName: rabbitmq
      DietKnowledgeService__BaseUrl: http://diet-knowledge-service:8080
      Gemini__Enabled: ${GEMINI_ENABLED:-false}
      Gemini__Endpoint: ${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com}
      Gemini__ApiKey: ${GEMINI_API_KEY:-development-only}
      Gemini__Model: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      diet-knowledge-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: src/Services/Notification/LongevityDiet.Notification.Grpc/Dockerfile
    ports:
      - "5105:8081"
    environment:
      RabbitMq__HostName: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: src/Workers/LongevityDiet.NotificationWorker/Dockerfile
    environment:
      RabbitMq__HostName: rabbitmq
      Resend__BaseUrl: ${RESEND_BASE_URL:-https://api.resend.com}
      Resend__ApiKey: ${RESEND_API_KEY:-development-only}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      Resend__FromName: ${RESEND_FROM_NAME:-Longevity Diet Platform}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: IdentityDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  diet-knowledge-db:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: DietKnowledgeDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - diet-knowledge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  meal-planning-db:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: MealPlanningDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - meal-planning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  tracking-db:
    image: postgres:16
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: TrackingDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - tracking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  identity-db-data:
  diet-knowledge-db-data:
  diet-knowledge-book-sources:
  meal-planning-db-data:
  tracking-db-data:
